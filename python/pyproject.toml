[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-funn"
version = "0.1.0"
description = "AI-Funn-game: a local-first artificial-life experiment with a randomly initialized neural policy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI-Funn-game contributors" }]
dependencies = [
    "numpy==1.26.4",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]
dev = [
    "ruff==0.16.1",
    "mypy==1.11.0",
]
ml = [
    "torch==2.5.1+cpu",
    "gymnasium==0.29.1",
    "stable-baselines3==2.5.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]